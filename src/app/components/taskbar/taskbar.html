<div class="taskbar">
  <!-- 시작 버튼 -->
  <button class="start-button" (click)="onStartMenuClick()" title="시작">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect width="20" height="20" rx="2" fill="#ffffff" />
    </svg>
  </button>

  <!-- 검색 (Cortana) -->
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle
        cx="7"
        cy="7"
        r="4"
        stroke="currentColor"
        stroke-width="1.5"
        fill="none"
      />
      <path
        d="M10 10L13 13"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
    <span class="search-text">Ask me anything</span>
  </div>

  <!-- 앱 아이콘들 -->
  <div class="taskbar-apps">
    <button
      *ngFor="let app of apps"
      class="taskbar-app"
      [class.active]="app.isActive"
      (click)="onAppClick(app.id)"
      [title]="app.name"
    >
      <img 
        *ngIf="app.icon" 
        [src]="app.icon" 
        [alt]="app.name" 
        width="24" 
        height="24"
      >
      <svg *ngIf="!app.icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect width="24" height="24" rx="2" fill="currentColor" />
      </svg>
    </button>
  </div>

  <!-- 시스템 트레이 -->
  <div class="system-tray">
    <!-- 네트워크 아이콘 -->
    <div class="tray-icon" title="네트워크">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path
          d="M2 8L6 4L10 8L14 4"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <!-- 볼륨 아이콘 -->
    <div class="tray-icon" title="볼륨">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path
          d="M3 5H6L9 2V14L6 11H3V5Z"
          stroke="currentColor"
          stroke-width="1.5"
          fill="none"
        />
        <path
          d="M10 6C10.5 6.5 11 7.5 11 8.5C11 9.5 10.5 10.5 10 11"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <!-- 알림 아이콘 -->
    <div class="tray-icon" title="알림">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path
          d="M8 2V4M8 12V14M2 8H4M12 8H14M4.343 4.343L5.757 5.757M10.243 10.243L11.657 11.657M4.343 11.657L5.757 10.243M10.243 5.757L11.657 4.343"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <!-- 시간 및 날짜 -->
    <div class="time-date">
      <div class="time">{{ getTimeString() }}</div>
      <div class="date">{{ getDateString() }}</div>
    </div>
  </div>
</div>
