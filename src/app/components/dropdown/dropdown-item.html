<ng-container *ngIf="!isDivider; else divider">
  <div class="dropdown-item" [class.has-check]="checked">
    <div class="check-area">
      <svg *ngIf="checked" width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M2 6L5 9L10 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="label">{{ label }}</span>
    <span *ngIf="shortcut" class="shortcut">{{ shortcut }}</span>
  </div>
</ng-container>

<ng-template #divider>
  <div class="dropdown-divider"></div>
</ng-template>
