<section class="home-section relative">
  <!-- Absolute Login Header for Home Section -->
  <div class="home-login-container">
    @if (authService.isLoggedIn()) {
      <button (click)="handleLogout()" class="btn-danger">
        주인장 로그아웃 😊
      </button>
    } @else {
      <button (click)="openLoginModal()" class="btn-primary_portfolio">
        주인장 로그인 😊
      </button>
    }
  </div>

  <!-- Login Modal -->
  @if (showLoginModal()) {
    <div class="login-modal-overlay">
      <div class="login-modal">
        <button type="button" class="close-icon-btn" (click)="closeLoginModal()" aria-label="Close">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <h2>주인장 로그인</h2>
        
        <div class="form-group">
          <label>Email</label>
          <input 
            type="email" 
            [ngModel]="loginEmail()"
            readonly
          />
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <input 
            type="password" 
            [ngModel]="loginPassword()"
            (ngModelChange)="loginPassword.set($event)"
            (keyup.enter)="handleLogin()"
            placeholder="비밀번호 입력"
            autofocus
          />
          @if (loginError()) {
            <p class="error-msg">비밀번호가 틀렸습니다.</p>
          }
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn-primary_portfolio" (click)="handleLogin()">
            로그인하기
          </button>
        </div>
      </div>
    </div>
  }

  <div class="shapes-container">
    @for (shape of shapes; track $index) {
    <div class="shape animate-float" [class]="colors[$index % colors.length]"
      [style.top]="getStyle($index).top" [style.left]="getStyle($index).left" [style.width]="getStyle($index).width"
      [style.height]="getStyle($index).height" [style.animation-delay]="getStyle($index).animationDelay"
      [style.animation-duration]="getStyle($index).animationDuration">
    </div>
    }
  </div>

  <div class="content-container">
    <h1 class="title">
      <span class="highlight-gray">설계에 진심인 </span>
      <br>
      <span class="highlight-yellow">프론트엔드 개발자</span>
      <br>
      <span class="highlight-white">입니다.</span>
    </h1>
    <p class="description">
      라이브러리를 만들 줄 모르는 개발자는 코더의 한계를 벗어날 수 없습니다.
      <br>
      기존의 틀을 넘어 프레임워크 만드는 것을 목표로 하고 있습니다.
      <br>
      개발자들이 원하는 프로그래머가 되고 싶은 이민재 입니다.
    </p>
  </div>

  <div class="scroll-indicator">
    <svg class="arrow-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
    </svg>
  </div>
</section>
