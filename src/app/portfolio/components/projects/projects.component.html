<section class="projects-section">
  <div class="section-header">
    <h2 class="section-title">Projects</h2>
    <p class="section-subtitle">개발 철학을 코드로 녹여낸 소중한 산출물들 입니다</p>
  </div>

  <div class="projects-container">
    @for (project of projects(); track project.title; let i = $index) {
    <div class="project-card" [class.active]="currentProjectIndex() === i"
      (click)="selectProject(project)">
      <div class="card-content">
        <div class="image-wrapper">
          <img [src]="project.imageUrl" alt="{{ project.title }}">
        </div>
        <div class="info-wrapper">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="tags">
            @for (tag of project.tags; track tag) {
            <span class="tag">{{ tag }}</span>
            }
          </div>
        </div>
      </div>
    </div>
    }
  </div>

  <div class="pagination">
    @for (project of projects(); track $index) {
    <button (click)="currentProjectIndex.set($index)" class="dot"
      [class.active]="currentProjectIndex() === $index">
    </button>
    }
  </div>
</section>

@if (selectedProject(); as project) {
<app-project-detail-modal [project]="project" (closeModal)="closeModal()">
</app-project-detail-modal>
}
