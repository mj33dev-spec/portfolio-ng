<app-side-panel [title]="project() ? '프로젝트 수정' : '프로젝트 추가'" (back)="closeModal.emit()">
  <form [formGroup]="projectForm" (ngSubmit)="save()" class="detail-container">
    
    <!-- Interactive Thumbnail Layout -->
    <div class="project-image-container form-group" formGroupName="platformImages">
      <div class="image-upload-wrapper has-image interactive-thumbnail">
        <div class="thumbnail-preview-layout">

          <!-- Mobile Slot -->
          <div class="preview-slot preview-mobile" [class.has-img]="projectForm.get('platformImages.mobile')?.value">
            <img class="device-frame" src="assets/portfolio/device-mobile.png" alt="Mobile Frame">
            <img class="user-screen" *ngIf="projectForm.get('platformImages.mobile')?.value" [src]="projectForm.get('platformImages.mobile')?.value" alt="Mobile Image">
            <div class="slot-placeholder" *ngIf="!projectForm.get('platformImages.mobile')?.value">
              <span>Mobile</span>
            </div>
            <button type="button" class="delete-img-btn" *ngIf="projectForm.get('platformImages.mobile')?.value" (click)="removeImage('platformImages.mobile', $event)">✕</button>
            <label class="slot-upload-overlay" [class.uploading]="isUploading()['platformImages.mobile']">
              <input type="file" accept="image/*" (change)="onFileSelected($event, 'platformImages.mobile')" [disabled]="isUploading()['platformImages.mobile']">
              <span *ngIf="!isUploading()['platformImages.mobile']" style="text-align: center;">+<br>375 x 667(px)</span>
              <span *ngIf="isUploading()['platformImages.mobile']">...</span>
            </label>
            <input type="hidden" formControlName="mobile">
          </div>
          
          <!-- PC Slot -->
          <div class="preview-slot preview-pc" [class.has-img]="projectForm.get('platformImages.pc')?.value">
            <img class="device-frame" src="assets/portfolio/device-pc.png" alt="PC Frame">
            <img class="user-screen" *ngIf="projectForm.get('platformImages.pc')?.value" [src]="projectForm.get('platformImages.pc')?.value" alt="PC Image">
            <div class="slot-placeholder" *ngIf="!projectForm.get('platformImages.pc')?.value">
              <span>PC</span>
            </div>
            <button type="button" class="delete-img-btn" *ngIf="projectForm.get('platformImages.pc')?.value" (click)="removeImage('platformImages.pc', $event)">✕</button>
            <label class="slot-upload-overlay" [class.uploading]="isUploading()['platformImages.pc']">
              <input type="file" accept="image/*" (change)="onFileSelected($event, 'platformImages.pc')" [disabled]="isUploading()['platformImages.pc']">
              <span *ngIf="!isUploading()['platformImages.pc']" style="text-align: center;">+<br>1440 x 895(px)</span>
              <span *ngIf="isUploading()['platformImages.pc']">...</span>
            </label>
            <input type="hidden" formControlName="pc">
          </div>

          <!-- Tablet Slot -->
          <div class="preview-slot preview-tablet" [class.has-img]="projectForm.get('platformImages.tablet')?.value">
            <img class="device-frame" src="assets/portfolio/device-tablet.png" alt="Tablet Frame">
            <img class="user-screen" *ngIf="projectForm.get('platformImages.tablet')?.value" [src]="projectForm.get('platformImages.tablet')?.value" alt="Tablet Image">
            <div class="slot-placeholder" *ngIf="!projectForm.get('platformImages.tablet')?.value">
              <span>Tablet</span>
            </div>
            <button type="button" class="delete-img-btn" *ngIf="projectForm.get('platformImages.tablet')?.value" (click)="removeImage('platformImages.tablet', $event)">✕</button>
            <label class="slot-upload-overlay" [class.uploading]="isUploading()['platformImages.tablet']">
              <input type="file" accept="image/*" (change)="onFileSelected($event, 'platformImages.tablet')" [disabled]="isUploading()['platformImages.tablet']">
              <span *ngIf="!isUploading()['platformImages.tablet']" style="text-align: center;">+<br>584 x 895(px)</span>
              <span *ngIf="isUploading()['platformImages.tablet']">...</span>
            </label>
            <input type="hidden" formControlName="tablet">
          </div>

        </div>
      </div>
    </div>

    <!-- Details below -->
    <div class="details-grid">
      <div class="full-width project-header form-group">
        <div class="affiliation-status-row">
          <c-dropdown 
            width="150px"
            [options]="affiliationOptions" 
            [value]="projectForm.get('affiliation')?.value || '소속 선택 *'"
            (valueChange)="projectForm.get('affiliation')?.setValue($event)">
          </c-dropdown>
          
          <c-dropdown 
            width="200px"
            [options]="statusOptions" 
            [value]="projectForm.get('status')?.value || '상태 선택 *'"
            (valueChange)="projectForm.get('status')?.setValue($event)"
            align="right">
          </c-dropdown>
        </div>
        
        <input type="text" formControlName="title" placeholder="프로젝트/회사명 (예: 아이엠히어) *" class="subtitle-input" />
        
        <div class="title-row">
          <div class="logo-upload-wrapper">
            <img *ngIf="projectForm.get('logo')?.value" [src]="projectForm.get('logo')?.value" alt="Logo" class="logo">
            <div class="logo-placeholder" *ngIf="!projectForm.get('logo')?.value">
              <span>로고 <span class="required-asterisk">*</span></span>
            </div>
            <label class="logo-upload-btn" [class.uploading]="isUploading()['logo']">
              <input type="file" accept="image/*" (change)="onFileSelected($event, 'logo')" [disabled]="isUploading()['logo']">
              +
            </label>
            <!-- 숨겨진 로고 URL 컨트롤 -->
            <input type="hidden" formControlName="logo">
          </div>
          
          <input type="text" formControlName="description" placeholder="프로젝트 서브타이틀 (예: 온라인 가구 쇼핑몰 커머스) *" class="title-input" />
        </div>
      </div>


      <div class="detail-item form-group">
        <h3>서비스 <span class="required-asterisk">*</span></h3>
        <c-dropdown 
          width="100%"
          variant="multi"
          [options]="serviceOptions" 
          [selectedValues]="projectForm.get('serviceTags')?.value || []"
          (optionClick)="toggleArrayValue('serviceTags', $event.value)"
          (removeValue)="removeArrayValue('serviceTags', $event)">
        </c-dropdown>
      </div>

      <div class="detail-item form-group">
        <h3>담당 파트 <span class="required-asterisk">*</span></h3>
        <c-dropdown 
          width="100%"
          variant="multi"
          [options]="roleOptions" 
          [selectedValues]="projectForm.get('roleTags')?.value || []"
          (optionClick)="toggleArrayValue('roleTags', $event.value)"
          (removeValue)="removeArrayValue('roleTags', $event)">
        </c-dropdown>
      </div>



      <div class="detail-item form-group">
        <h3>개발 기간 <span class="required-asterisk">*</span></h3>
        <input type="text" formControlName="workPeriod" placeholder="YYYY.MM ~ YYYY.MM" />
      </div>

      <div class="detail-item form-group">
        <h3>작업 환경 <span class="required-asterisk">*</span></h3>
        <c-dropdown 
          width="100%"
          variant="multi"
          [options]="envOptions" 
          [selectedValues]="projectForm.get('developmentEnvironment')?.value || []"
          (optionClick)="toggleArrayValue('developmentEnvironment', $event.value)"
          (removeValue)="removeArrayValue('developmentEnvironment', $event)">
        </c-dropdown>
      </div>

      <div class="detail-item form-group">
        <h3>주요 업무<span class="required-asterisk">*</span></h3>
        <textarea formControlName="scopeAndContribution" placeholder="주요 업무를 작성해주세요."></textarea>
      </div>

      <div class="detail-item form-group">
        <h3>개발 언어 <span class="required-asterisk">*</span></h3>
        <c-dropdown 
          width="100%"
          variant="multi"
          [options]="langOptions" 
          [selectedValues]="projectForm.get('developmentLanguage')?.value || []"
          (optionClick)="toggleArrayValue('developmentLanguage', $event.value)"
          (removeValue)="removeArrayValue('developmentLanguage', $event)">
        </c-dropdown>
      </div>
      
      <div class="detail-item form-group">
        <h3>정렬 순서 (높을수록 상단)</h3>
        <input type="number" formControlName="sortOrder" placeholder="0" />
      </div>

      <div class="detail-item form-group">
        <h3>포트폴리오 카드 색상 (Hex)</h3>
        <input type="text" formControlName="color" placeholder="#000000" />
      </div>





      <!-- Links -->
      <div class="full-width links-section form-fieldset">
        <div class="fieldset-header">
          <h3>관련 링크 (첨부하지 않을 항목은 비워두세요)</h3>
        </div>
        <div formGroupName="links" class="links-container">
          <div class="link-row">
            <span class="link-label">iOS 앱</span>
            <input type="text" formControlName="ios" placeholder="URL" />
          </div>
          <div class="link-row">
            <span class="link-label">Android 앱</span>
            <input type="text" formControlName="android" placeholder="URL" />
          </div>
          <div class="link-row">
            <span class="link-label">랜딩페이지</span>
            <input type="text" formControlName="landing" placeholder="URL" />
          </div>
          <div class="link-row">
            <span class="link-label">메인 웹사이트</span>
            <input type="text" formControlName="web" placeholder="URL" />
          </div>
          <div class="link-row">
            <span class="link-label">관리자페이지</span>
            <input type="text" formControlName="admin" placeholder="URL" />
          </div>
        </div>
      </div>

      <div class="full-width retrospective form-group">
        <h3>프로젝트 회고</h3>
        <textarea formControlName="retrospective" rows="4" placeholder="프로젝트를 진행하며 느낀 점이나 회고를 적어주세요."></textarea>
      </div>
      
    </div>

    <div class="modal-footer">
      <!-- <button type="button" class="btn-secondary" (click)="closeModal.emit()" [disabled]="isSaving">취소</button> -->
      
      @if (projectForm.valid) {
        <button type="submit" class="btn-primary" [disabled]="isSaving">
          {{ isSaving ? '저장 중...' : '저장하기' }}
        </button>
      } @else {
        <button type="button" class="btn-disabled" disabled>
          저장하기
        </button>
      }
    </div>
  </form>
</app-side-panel>
