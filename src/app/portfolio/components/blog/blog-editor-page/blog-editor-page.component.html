<app-side-panel [title]="isEditMode() ? '게시물 수정' : '새 게시물 작성'" (back)="goBack()">
  
  <div class="detail-container">
    <div class="form-row">
      <div class="form-group">
        <label>카테고리</label>
        <c-dropdown 
          width="200px"
          [value]="category() || '카테고리를 선택하세요'" 
          (valueChange)="category.set($event)" 
          [options]="categoryOptions"
          variant="outlined">
        </c-dropdown>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group flex-3">
        <label>제목</label>
        <input type="text" [ngModel]="title()" (ngModelChange)="title.set($event)" placeholder="글 제목을 입력하세요" autofocus>
      </div>
    </div>

    <!-- 블록 에디터 영역 -->
    <div class="form-group blocks-editor-group">
      <label>본문 내용 (블록 단위 편집, 드래그앤드롭으로 순서 변경 가능)</label>
      
      <div class="editor-blocks">
        @for (block of blocks(); track block.id; let idx = $index) {
          <div class="block-row" 
               draggable="true"
               (dragstart)="onBlockDragStart(idx)"
               (dragover)="onBlockDragOver($event, idx)"
               (drop)="onBlockDrop($event, idx)"
               (dragend)="onBlockDragEnd()">
            
            <!-- 드래그 핸들 -->
            <div class="block-drag-handle">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
            </div>

            <!-- 블록 종류별 표시 -->
            <div class="block-content">
              @if (block.type === 'text') {
                <textarea [ngModel]="block.value" 
                          (ngModelChange)="updateBlockValue(idx, $event)" 
                          placeholder="본문 내용을 입력하세요... (마크다운 지원: # 제목, --- 구분선)"
                          rows="4"
                          class="block-textarea"></textarea>
              } @else if (block.type === 'image') {
                <div class="block-image-uploader">
                  @if (block.value) {
                    <div class="block-image-preview">
                      <img [src]="block.value" alt="블록 이미지">
                      <button type="button" class="btn-clear-image" (click)="updateBlockValue(idx, '')">이미지 삭제</button>
                    </div>
                  } @else {
                    <label class="block-upload-label">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                      이미지 업로드
                      <input type="file" accept="image/*" (change)="onBlockFileSelected($event, idx)" [disabled]="uploadingBlockIndex() === idx">
                    </label>
                    <span class="upload-status" *ngIf="uploadingBlockIndex() === idx">업로드 중...</span>
                  }
                </div>
              }
            </div>

            <!-- 블록 삭제 버튼 -->
            <button type="button" class="btn-delete-block" (click)="removeBlock(idx)" title="섹션 삭제">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

          </div>
        }
      </div>

      <!-- 블록 추가 버튼 영역 -->
      <div class="block-add-actions">
        <button type="button" class="btn-add-block" (click)="addTextBlock()">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          텍스트 섹션 추가
        </button>
        <button type="button" class="btn-add-block" (click)="addImageBlock()">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          이미지 섹션 추가
        </button>
      </div>
    </div>

    <div class="form-group tags-group">
      <label>태그 (쉼표로 구분)</label>
      <input type="text" [ngModel]="tagsInput()" (ngModelChange)="tagsInput.set($event)" placeholder="예: Angular, Frontend, 웹개발">
    </div>
    
    <div class="modal-footer">
      <button class="btn-primary_portfolio" (click)="savePost()">저장하기</button>
    </div>
  </div>
</app-side-panel>
