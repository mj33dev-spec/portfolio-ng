<app-side-panel [title]="isEditMode() ? '게시물 수정' : '새 게시물 작성'" (back)="goBack()">
  
  <div class="editor-container">
    <div class="editor-body">
      <div class="form-row">
        <div class="form-group">
          <label>카테고리</label>
          <c-dropdown 
            width="200px"
            [value]="category() || '카테고리를 선택하세요'" 
            (valueChange)="category.set($event)" 
            [options]="categoryOptions"
            variant="outlined">
          </c-dropdown>
        </div>

        <!-- <div class="form-group">
          <label>테마 컬러</label>
          <input type="color" [ngModel]="color()" (ngModelChange)="color.set($event)" class="color-picker">
        </div> -->
      </div>

      <div class="form-row">
        <div class="form-group flex-3">
          <label>제목</label>
          <input type="text" [ngModel]="title()" (ngModelChange)="title.set($event)" placeholder="글 제목을 입력하세요" autofocus>
        </div>
      </div>

      <div class="form-group content-group">
        <label>내용 (Markdown 지원)</label>
        <textarea [ngModel]="content()" (ngModelChange)="content.set($event)" placeholder="마크다운 형식으로 내용을 입력하세요..."></textarea>
      </div>

      <!-- 이미지 첨부 영역 -->
      <div class="form-group upload-group">
        <label class="upload-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          이미지 첨부하기
          <input type="file" accept="image/*" (change)="onFileSelected($event)" [disabled]="isUploading()">
        </label>
        <span class="upload-status" *ngIf="isUploading()">업로드 중...</span>
        
        <!-- 첨부사진 섹션 (미리보기) -->
        <div class="image-preview" *ngIf="imageUrl()" style="margin-top: 12px;">
          <img [src]="imageUrl()" alt="첨부된 이미지" style="max-height: 200px; border-radius: 8px; border: 1px solid #3f3f46; object-fit: contain;">
        </div>
      </div>

      <div class="form-group tags-group">
        <label>태그 (쉼표로 구분)</label>
        <input type="text" [ngModel]="tagsInput()" (ngModelChange)="tagsInput.set($event)" placeholder="예: Angular, Frontend, 웹개발">
      </div>
      
      <div class="form-actions">
        <button class="btn-primary_portfolio" (click)="savePost()">저장하기</button>
      </div>
    </div>
  </div>
</app-side-panel>
