<section class="editor-section">
  <div class="editor-container">
    <div class="editor-header">
      <button class="back-btn" (click)="goBack()">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        취소
      </button>

      <h2 class="page-title">{{ isEditMode() ? '게시물 수정' : '새 게시물 작성' }}</h2>
      <div style="width: 50px;"></div> <!-- Placeholder to balance layout -->
    </div>

    <div class="editor-body">
      <div class="form-row">
        <div class="form-group">
          <label>카테고리</label>
          <c-dropdown 
            [value]="category() || '카테고리를 선택하세요'" 
            (valueChange)="category.set($event)" 
            [options]="categoryOptions"
            width="100%"
            variant="outlined">
          </c-dropdown>
        </div>

        <div class="form-group">
          <label>테마 컬러</label>
          <input type="color" [ngModel]="color()" (ngModelChange)="color.set($event)" class="color-picker">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-3">
          <label>제목</label>
          <input type="text" [ngModel]="title()" (ngModelChange)="title.set($event)" placeholder="글 제목을 입력하세요" autofocus>
        </div>
      </div>

      <div class="form-group">
        <label>이미지 첨부</label>
        <input type="file" accept="image/*" (change)="onFileSelected($event)">
        @if (isUploading()) {
          <span class="upload-status" style="color: #facc15; font-size: 0.875rem;">업로드 중...</span>
        }
        @if (imageUrl()) {
          <div class="image-preview" style="margin-top: 0.5rem;">
            <img [src]="imageUrl()" alt="첨부된 이미지" style="max-height: 200px; border-radius: 0.5rem; border: 1px solid #3f3f46;">
          </div>
        }
      </div>

      <div class="form-group">
        <label>태그 (콤마로 구분)</label>
        <input type="text" [ngModel]="tagsInput()" (ngModelChange)="tagsInput.set($event)" placeholder="예: frontend, angular, web">
      </div>

      <div class="form-group">
        <label>내용 (Markdown 지원)</label>
        <textarea [ngModel]="content()" (ngModelChange)="content.set($event)" placeholder="마크다운 문법으로 내용을 작성하세요..." rows="20"></textarea>
      </div>

      <div class="editor-footer">
        <button class="btn-primary_portfolio save-btn" (click)="savePost()">저장하기</button>
      </div>
    </div>
  </div>
</section>
