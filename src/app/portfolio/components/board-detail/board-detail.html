@if (post()) {
<app-side-panel (back)="goBack()">

  <div class="detail-container">
    <div class="post-header-row">
      <div class="title-wrapper">
        <c-category-badge [category]="post()!.category" size="md"></c-category-badge>
        <h1 class="post-title">{{ post()!.title }}</h1>
      </div>
      <span class="header-date">{{ (post()!.updated_at || post()!.created_at) | date:'yyyy.MM.dd' }}</span>
    </div>

    <!-- 첨부사진 렌더링 -->
    <div class="post-image" *ngIf="post()!.image_url" style="margin-bottom: 24px;">
      <img [src]="post()!.image_url" alt="첨부된 이미지" style="max-width: 100%; border-radius: 8px;">
    </div>

    <!-- 마크다운 렌더링 -->
    <div class="post-content markdown-body" [innerHTML]="compiledMarkdown()"></div>
    
    <!-- 태그 -->
    <div class="post-tags" *ngIf="post()!.tags?.length">
      <c-badge *ngFor="let tag of post()!.tags" [label]="'#' + tag" variant="neutral" size="md"></c-badge>
    </div>

    <!-- 수정/삭제 버튼 -->
    <div class="detail-actions" *ngIf="authService.isLoggedIn()">
      <button class="btn-outlined-primary_portfolio" (click)="editPost()">수정</button>
      <button class="btn-danger" (click)="deletePost()">삭제</button>
    </div>
  </div>
</app-side-panel>
} @else if (loading()) {
  <div class="loading">Loading...</div>
}
