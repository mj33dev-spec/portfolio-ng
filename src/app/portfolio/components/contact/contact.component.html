<section class="contact-section">
  <div class="content-container">
    <div class="section-header">
      <h2 class="section-title">Contact</h2>
      <p class="section-subtitle">저에 대해 더 궁금하신가요?</p>
    </div>

    <div class="contact-card">
      <form [formGroup]="contactForm" (ngSubmit)="submitForm()">
        <div class="form-grid">
          <div class="input-wrapper">
            <input formControlName="company" type="text" placeholder="회사명" class="form-input">
          </div>
          <div class="input-wrapper">
            <input formControlName="name" type="text" placeholder="담당자명" class="form-input">
          </div>
        </div>
        <div class="form-group">
          <div class="input-wrapper">
            <input formControlName="contact" type="text" placeholder="이메일 또는 연락처" class="form-input">
          </div>
        </div>
        <div class="form-group">
          <div class="input-wrapper">
            <textarea formControlName="message" placeholder="내용을 10자 이상 입력해주세요" rows="6" class="form-input"></textarea>
          </div>
        </div>
        <button type="submit" [disabled]="isSending()" class="btn-full" [ngClass]="contactForm.invalid ? 'btn-dark' : 'btn-primary_portfolio'">
          {{ isSending() ? '전송 중...' : '이메일 전송' }}
        </button>
      </form>
    </div>

    <div class="social-links">
      <p>또는 소셜 미디어에서 저를 찾아보세요:</p>
      <div class="links">
        <a href="#">GitHub</a>
        <a href="#">LinkedIn</a>
        <a href="#">Twitter</a>
      </div>
    </div>
  </div>
</section>
